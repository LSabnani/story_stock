<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Stocks - Yahoo Finance Intelligence Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.15) 0px, transparent 45%),
        radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.15) 0px, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
    }

    .logo-title {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .provider-pill {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-watchlist-toggle {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c084fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-watchlist-toggle:hover {
      background: rgba(139, 92, 246, 0.35);
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .btn-search {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: none;
      color: white;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-search:hover { transform: scale(1.02); }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 28px;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      background: rgba(9, 13, 22, 0.9);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }

    .story-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .story-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .ticker-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticker-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #6b7280;
      transition: color 0.2s, transform 0.1s;
    }

    .star-btn.active { color: #f59e0b; }
    .star-btn:hover { transform: scale(1.2); }

    .price-box { text-align: right; }
    .stock-price { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 18px; }
    .stock-change { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .positive { color: var(--accent-green); }
    .negative { color: var(--accent-red); }

    .sector-tag-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-sector { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-industry { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }

    .headline {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .headline a { color: #ffffff; text-decoration: none; }
    .headline a:hover { text-decoration: underline; color: #93c5fd; }

    .summary {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .revenue-impact-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-box {
      height: 110px;
      width: 100%;
      margin-bottom: 14px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 6px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }

    .sentiment-badge-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sentiment-score {
      padding: 4px 10px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #fff;
    }

    .bg-bullish { background: #10b981; color: #000; }
    .bg-neutral { background: #3b82f6; color: #fff; }
    .bg-bearish { background: #ef4444; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <div class="logo-icon">S</div>
      <div>
        <div class="logo-title">Story Stocks</div>
        <div style="font-size: 12px; color: var(--text-muted)">Revenue Impact & Sentiment Intelligence</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="watchlistToggleBtn" class="btn-watchlist-toggle" onclick="toggleWatchlistFilter()">
        ★ Watchlist (<span id="watchlistCount">0</span>)
      </button>
      <div class="provider-pill">
        <span>● Feed:</span>
        <strong>Yahoo Finance Live</strong>
      </div>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="tickerSearchInput" class="search-input" placeholder="Enter stock ticker (e.g. SMMT, FICO, IOVA, SDEV, CCL, NVTS, AAPL)..." onkeypress="if(event.key === 'Enter') addTicker()">
    <button class="btn-search" onclick="addTicker()">Analyze Ticker Story</button>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <span class="control-label">Sort By:</span>
      <select id="sortSelect" onchange="loadStories()">
        <option value="sentiment">Sentiment Score (High to Low)</option>
        <option value="sector">Sector & Industry</option>
        <option value="industry">Industry</option>
        <option value="change">% Price Change</option>
        <option value="ticker">Ticker Symbol</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Sector:</span>
      <select id="sectorSelect" onchange="loadStories()">
        <option value="All">All Sectors</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Industry:</span>
      <select id="industrySelect" onchange="loadStories()">
        <option value="All">All Industries</option>
      </select>
    </div>
  </div>

  <div class="stories-grid" id="storiesGrid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
      Fetching live Yahoo Finance news & revenue impact models...
    </div>
  </div>

  <script>
    const API_BASE = '/api/v1';
    let currentStories = [];
    let showOnlyWatchlist = false;

    function getWatchlist() {
      return JSON.parse(localStorage.getItem('story_stocks_watchlist') || '[]');
    }

    function setWatchlist(list) {
      localStorage.setItem('story_stocks_watchlist', JSON.stringify(list));
      updateWatchlistBadge();
    }

    function toggleWatchlistTicker(ticker) {
      let list = getWatchlist();
      if (list.includes(ticker)) {
        list = list.filter(t => t !== ticker);
      } else {
        list.push(ticker);
      }
      setWatchlist(list);
      loadStories();
    }

    function updateWatchlistBadge() {
      const count = getWatchlist().length;
      document.getElementById('watchlistCount').innerText = count;
    }

    function toggleWatchlistFilter() {
      showOnlyWatchlist = !showOnlyWatchlist;
      const btn = document.getElementById('watchlistToggleBtn');
      if (showOnlyWatchlist) {
        btn.style.background = '#8b5cf6';
        btn.style.color = '#fff';
      } else {
        btn.style.background = 'rgba(139, 92, 246, 0.2)';
        btn.style.color = '#c084fc';
      }
      loadStories();
    }

    async function fetchFilters() {
      try {
        const res = await fetch(`${API_BASE}/meta/filters`);
        const data = await res.json();
        
        const sectorSelect = document.getElementById('sectorSelect');
        sectorSelect.innerHTML = data.sectors.map(s => `<option value="${s}">${s}</option>`).join('');
        
        const industrySelect = document.getElementById('industrySelect');
        industrySelect.innerHTML = data.industries.map(i => `<option value="${i}">${i}</option>`).join('');
      } catch (err) {
        console.error('Error fetching filters:', err);
      }
    }

    async function loadStories() {
      const sortBy = document.getElementById('sortSelect').value;
      const sector = document.getElementById('sectorSelect').value;
      const industry = document.getElementById('industrySelect').value;

      try {
        const res = await fetch(`${API_BASE}/stories?sort_by=${sortBy}&sector=${sector}&industry=${industry}`);
        let stories = await res.json();
        
        if (showOnlyWatchlist) {
          const wl = getWatchlist();
          stories = stories.filter(s => wl.includes(s.ticker));
        }

        currentStories = stories;
        renderStories(stories);
      } catch (err) {
        console.error('Error loading stories:', err);
      }
    }

    async function addTicker() {
      const input = document.getElementById('tickerSearchInput');
      const ticker = input.value.trim().toUpperCase();
      if (!ticker) return;

      const grid = document.getElementById('storiesGrid');
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Analyzing story & revenue impact for <strong>${ticker}</strong> via Yahoo Finance...</div>`;

      try {
        const res = await fetch(`${API_BASE}/stocks/${ticker}`);
        const data = await res.json();
        if (data.error) {
          alert(`Ticker ${ticker} not found.`);
          loadStories();
        } else {
          renderStories([data]);
        }
      } catch (err) {
        console.error('Error fetching ticker:', err);
        loadStories();
      }
    }

    function renderStories(stories) {
      const grid = document.getElementById('storiesGrid');
      if (!stories || stories.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No story stocks match the selected criteria or watchlist.</div>';
        return;
      }

      const watchlist = getWatchlist();

      grid.innerHTML = stories.map(story => {
        const isPos = story.change_percent >= 0;
        const isStarred = watchlist.includes(story.ticker);
        const sentClass = story.sentiment === 'Bullish' ? 'bg-bullish' : (story.sentiment === 'Bearish' ? 'bg-bearish' : 'bg-neutral');

        return `
          <div class="story-card">
            <div>
              <div class="card-top">
                <div>
                  <div class="ticker-header">
                    <span class="ticker-badge">${story.ticker}</span>
                    <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleWatchlistTicker('${story.ticker}')" title="Toggle Watchlist">
                      ${isStarred ? '★' : '☆'}
                    </button>
                  </div>
                  <div style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">${story.company_name}</div>
                </div>
                <div class="price-box">
                  <div class="stock-price">$${story.price.toFixed(2)}</div>
                  <div class="stock-change ${isPos ? 'positive' : 'negative'}">
                    ${isPos ? '▲ +' : '▼ '}${story.change_percent.toFixed(2)}%
                  </div>
                </div>
              </div>

              <div class="sector-tag-group">
                <span class="tag tag-sector">${story.sector}</span>
                <span class="tag tag-industry">${story.industry}</span>
              </div>

              <div class="headline">
                <a href="${story.news_url}" target="_blank" title="Read story on Yahoo Finance">${story.headline} ↗</a>
              </div>
              <div class="summary">${story.summary}</div>
              
              <div class="revenue-impact-badge">
                💵 <span>${story.annual_revenue_impact || story.product_impact}</span>
              </div>

              <div class="chart-box">
                <canvas id="chart-${story.ticker}"></canvas>
              </div>
            </div>

            <div class="card-footer">
              <span style="color: var(--text-muted)">Via ${story.publisher}</span>
              <div class="sentiment-badge-box">
                <span style="color:var(--text-muted)">Sentiment</span>
                <span class="sentiment-score ${sentClass}">${story.sentiment_score} (${story.sentiment})</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Render Charts
      setTimeout(() => {
        stories.forEach(story => {
          if (story.price_history && story.price_history.length > 0) {
            renderStockChart(story.ticker, story.price_history, story.change_percent >= 0);
          }
        });
      }, 50);
    }

    function renderStockChart(ticker, history, isPositive) {
      const ctx = document.getElementById(`chart-${ticker}`);
      if (!ctx) return;

      const labels = history.map(h => h.date);
      const data = history.map(h => h.close);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: isPositive ? '#10b981' : '#ef4444',
            borderWidth: 2,
            pointRadius: 0,
            fill: true,
            backgroundColor: isPositive ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)',
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: { display: false },
            y: { display: false }
          }
        }
      });
    }

    updateWatchlistBadge();
    fetchFilters();
    loadStories();
  </script>
</body>
</html>
